name: 缺陷反馈 (Bug Report)
description: 报告补丁安装失败、崩溃或界面渲染异常
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题！请提供尽可能详细的操作系统和版本信息。
  - type: dropdown
    id: os
    attributes:
      label: 操作系统 (Operating System)
      options:
        - Windows 11 / 10
        - macOS (Apple Silicon / Intel)
        - Linux (Ubuntu / Debian / Arch / etc.)
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: Antigravity 版本号
      placeholder: "e.g. 2.19.1"
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么错误？
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 终端或日志输出 (Logs)
      description: 粘贴 `npx antigravity-chinese status` 或安装时的终端输出
      render: shell
